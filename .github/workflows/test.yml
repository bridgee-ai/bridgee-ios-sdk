name: Unit tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - name: Compile iOS Simulator SDK
        run: >-
          xcodebuild -scheme BridgeeSDK -sdk iphonesimulator -configuration Debug
          -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios
          CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: blink-deferred-ios-build-evidence
          path: build/ios/Logs/Build
          if-no-files-found: error
          retention-days: 7
  cocoapods:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install cocoapods --version 1.16.2 --no-document
      - name: Validate local release podspec without publishing
        run: |
          set -o pipefail
          xcodebuild -version
          pod lib lint BridgeeAiSDK.podspec --platforms=ios --allow-warnings --verbose 2>&1 | tee cocoapods-lint.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bridgee-ios-cocoapods-lint-evidence
          path: cocoapods-lint.log
          if-no-files-found: error
          retention-days: 7
